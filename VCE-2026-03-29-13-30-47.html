<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ethio Study Pro AI</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    font-family:'Fredoka', Arial, sans-serif;
}

/* HERO */
.hero {
    height:100vh;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background: linear-gradient(rgba(0,0,0,0.4), rgba(106,13,173,0.6)),
                url("https://images.unsplash.com/photo-1512820790803-83ca734da794");
    background-size:cover;
    text-align:center;
}

.hero h1 { font-size:60px; }

.btn {
    padding:14px 30px;
    border:none;
    background:linear-gradient(45deg, #6a0dad, #9b30ff);
    color:white;
    border-radius:30px;
    cursor:pointer;
}

/* DASHBOARD */
.content {
    display:none;
    padding:40px;
    background:#6a0dad;
    color:white;
}

/* CARDS */
.card {
    display:inline-block;
    padding:25px;
    margin:15px;
    border-radius:15px;
    background:white;
    color:#6a0dad;
    cursor:pointer;
}

.card:hover {
    transform:scale(1.05);
    transition:0.3s;
}

/* PAGES */
.page {
    display:none;
    padding:40px;
}

/* BOOKS */
#booksPage {
    background:linear-gradient(to right,#6a0dad,#9b30ff);
    color:white;
}

/* TIMER */
.timer-box {
    display:flex;
    justify-content:center;
    align-items:center;
    height:80vh;
    background:#ffd6e7;
    flex-direction:column;
}

/* TABLE */
table {
    width:90%;
    margin:auto;
    border-collapse:collapse;
}

th {
    background:#6a0dad;
    color:white;
}

td, th {
    border:1px solid #ccc;
    padding:10px;
}

/* PROGRESS BAR */
#xpBar {
    width:100%;
    background:white;
    color:#6a0dad;
    padding:10px;
    border-radius:10px;
    margin-top:20px;
}
</style>

</head>

<body>

<!-- HERO -->
<div class="hero" id="hero">
<h1>ETHIO STUDY PRO</h1>
<button class="btn" onclick="signup()">Get Started</button>
</div>

<!-- DASHBOARD -->
<div class="content" id="content">

<h1>Dashboard</h1>

<div class="card" onclick="openTimer()">⏱ Timer</div>
<div class="card" onclick="openBooks()">📚 Books</div>
<div class="card" onclick="openPlanner()">📅 Planner</div>

<div id="xpBar">XP: 0 | Level: 1</div>

</div>

<!-- TIMER -->
<div class="page" id="timerPage">
<div class="timer-box">

<h1>⏱ Timer</h1>

<div id="time" style="font-size:70px;">00:00:00</div>

<input id="h" placeholder="H">
<input id="m" placeholder="M">
<input id="s" placeholder="S">

<br><br>

<button onclick="setTimer()">Set</button>
<button onclick="startTimer()">Start</button>
<button onclick="pauseTimer()">Pause</button>
<button onclick="resetTimer()">Reset</button>
<button onclick="focusMode()">🔒 Focus Mode</button>

</div>
</div>

<!-- BOOKS -->
<div class="page" id="booksPage">
<h1>📚 Select Grade</h1>
<div id="grades" style="text-align:center;"></div>
</div>

<!-- PLANNER -->
<div class="page" id="plannerPage">

<h1>📅 Smart Planner</h1>

<input id="subjects" placeholder="Subjects (Math, Physics)">
<br><br>

<input id="studyHours" placeholder="Study Hours">
<br><br>

<input id="breakTime" placeholder="Break (min)">
<br><br>

<input id="studyDate" type="date">

<br><br>

<button onclick="generateAIPlan()">Generate Plan</button>

<br><br>

<table id="planTable">
<tr>
<th>Time</th>
<th>Subject</th>
<th>Type</th>
</tr>
</table>

</div>

<!-- NAV -->
<div style="position:fixed;bottom:20px;left:20px;">
<button onclick="goBack()">⬅ Back</button>
<button onclick="goHome()">Home</button>
</div>

<script>

/* NAV */
function signup(){
hero.style.display="none";
content.style.display="block";
}

function show(page){
content.style.display="none";
timerPage.style.display="none";
booksPage.style.display="none";
plannerPage.style.display="none";
page.style.display="block";
}

function openTimer(){ show(timerPage); }
function openBooks(){ show(booksPage); createGrades(); }
function openPlanner(){ show(plannerPage); }

function goBack(){ show(content); }
function goHome(){ location.reload(); }

/* TIMER */
let total=0, interval, focusActive=false;

function setTimer(){
total = (+h.value||0)*3600 + (+m.value||0)*60 + (+s.value||0);
update();
}

function update(){
let hr = String(Math.floor(total/3600)).padStart(2,'0');
let mn = String(Math.floor(total%3600/60)).padStart(2,'0');
let sc = String(total%60).padStart(2,'0');
time.innerText = hr+":"+mn+":"+sc;
}

function startTimer(){
interval = setInterval(()=>{
if(total>0){
 total--;
 update();
}
else{
 clearInterval(interval);
 stopFocus();
 alert("🎉 Finished!");
}
},1000);
}

function pauseTimer(){ clearInterval(interval); }

function resetTimer(){ pauseTimer(); }

/* FOCUS MODE */
function focusMode(){

if(total<=0){
alert("Set timer first!");
return;
}

focusActive = true;

alert("🔒 Focus Mode ON");

document.documentElement.requestFullscreen().catch(()=>{});

window.onbeforeunload = function(){
return "Focus Mode Active!";
};
}

function stopFocus(){
focusActive=false;
window.onbeforeunload=null;

if(document.exitFullscreen){
document.exitFullscreen();
}
}

/* BLOCK EXIT KEYS */
document.addEventListener("keydown", function(e){
if(focusActive){
if(e.key==="Escape" || (e.ctrlKey && e.key==="w")){
e.preventDefault();
alert("⚠️ Focus Mode!");
}
}
});

/* XP SYSTEM */
let xp=0;
let level=1;

function addXP(val){
xp+=val;

if(xp >= level*100){
xp -= level*100;
level++;
alert("🔥 LEVEL UP: "+level);
}

updateXP();
}

function updateXP(){
document.getElementById("xpBar").innerText =
"XP: "+xp+" | Level: "+level;
}

/* STREAK */
function checkStreak(){
let today=new Date().toDateString();
let last=localStorage.getItem("last");

if(last!==today){
let streak=parseInt(localStorage.getItem("streak")||0)+1;
localStorage.setItem("streak",streak);
localStorage.setItem("last",today);
alert("🔥 Streak: "+streak);
}
}

/* BOOKS */
function createGrades(){
let g=document.getElementById("grades");
g.innerHTML="";
for(let i=1;i<=12;i++){
g.innerHTML+=`<div class="card" onclick="openGrade(${i})">Grade ${i}</div>`;
}
}

function openGrade(g){
window.open("https://kehulum.com/student-textbook/new/grade-"+g);
addXP(10);
checkStreak();
}

/* PLANNER */
function generateAIPlan(){

let subs=subjects.value.split(",").map(s=>s.trim());
let hours=+studyHours.value||2;
let breakMin=+breakTime.value||10;

let table=document.getElementById("planTable");

table.innerHTML=`<tr><th>Time</th><th>Subject</th><th>Type</th></tr>`;

let time=6;

subs.forEach(sub=>{
table.innerHTML+=`
<tr>
<td>${time}:00</td>
<td>${sub}</td>
<td>🔥 Study</td>
</tr>`;

table.innerHTML+=`
<tr>
<td>${breakMin} min</td>
<td>-</td>
<td>☕ Break</td>
</tr>`;

addXP(10);

time++;
});

}

/* LOAD */
let imgs=[
"https://images.unsplash.com/photo-1503676260728-1c00da094a0b"
];

setInterval(()=>{
hero.style.backgroundImage=`url(${imgs[0]})`;
},5000);

</script>

</body>
</html>
